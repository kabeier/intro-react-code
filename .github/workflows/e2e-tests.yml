name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Cypress (dev server)
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run dev
          wait-on: 'http://localhost:5173/'

      - name: Cypress (built site)
        uses: cypress-io/github-action@v7
        with:
          install: false
          start: npm run preview
          wait-on: 'http://localhost:4173/pokemon-app/'
          config: baseUrl=http://localhost:4173/pokemon-app/,specPattern=cypress/e2e-prod/**/*.cy.js